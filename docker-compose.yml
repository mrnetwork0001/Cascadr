# Cascadr — full stack for the VPS.
#
#   cp backend/.env.example backend/.env   # then paste your keys
#   docker compose up -d --build
#
# The browser talks only to the frontend: it calls same-origin /api, which
# the Next server proxies to the backend over the internal network. The
# backend therefore needs no public port.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Where SQLite lives inside the container (mapped to the volume below).
      CASCADR_DB: /data/cascadr.db
      # The browser origin that is allowed to call this API.
      CASCADR_CORS_ORIGINS: ${PUBLIC_SITE_URL:-http://localhost:4010}
    expose:
      - "8010"
    volumes:
      # Named volume, not a bind mount: the paper-trading journal is the
      # record the submission is scored on and must survive redeploys.
      - cascadr-data:/data

  frontend:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:8010
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8010
    ports:
      - "4010:4010"
    depends_on:
      - backend

volumes:
  cascadr-data:
